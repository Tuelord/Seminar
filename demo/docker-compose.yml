# demo/docker-compose.yml
# Michelangelo Mini Demo — Infrastructure Stack
#
# Services:
#   - MLflow Tracking Server  (http://localhost:5001)
#     Model artifacts are stored in a local volume and served by MLflow itself
#     (MinIO images are no longer published publicly).
#
# Usage:
#   docker compose up -d

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2  # keep in sync with requirements.txt
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
    ports:
      - "5001:5000"    # host 5000 is taken by AirPlay on macOS
    volumes:
      - mlflow_data:/mlflow

volumes:
  mlflow_data:
